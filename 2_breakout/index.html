<html>
  <head>
	<title>Break Out</title>
	<style>
	  body {
		  background-color: grey;
		  padding: 0;
	  }

	  #c {
		  margin: auto;
		  width: 640px;
		  height: 480px;
	  }
	</style>
  </head>
  <body>
	<canvas id="c" width="640" height="480"></canvas>
	<script>
	  function makeScreen(canvasElement) {
		  const ctxt = canvasElement.getContext('2d');
				
		  return Object.freeze({
			  clear() {
				  ctxt.fillStyle = 'black';
				  ctxt.fillRect(0, 0, canvasElement.width, canvasElement.height);
			  },
			  
			  rect(color, rectLike) {
				  ctxt.fillStyle = color;
				  ctxt.fillRect(rectLike.x, rectLike.y, rectLike.width, rectLike.height);
			  },


			  width: canvasElement.clientWidth,
			  height: canvasElement.clientHeight,
		  });
	  }

	  function makeTimer() {
		  let last = performance.now(),
			  running = false;

		  return Object.freeze({
			  start() {
				  running = true;
				  last = performance.now();
			  },

			  reset() {
				  last = performance.now();
			  },
			  
			  lap() {
				  let now = performance.now();
				  let elapsed = now - last;

				  last = now;

				  return elapsed / 1000;
			  }
		  });
	  }

	  function aabb(body1, body2) {
		  let x1 = body1.x,
			  x2 = body2.x,
			  y1 = body1.y,
			  y2 = body2.y,
			  w1 = body1.width,
			  w2 = body2.width,
			  h1 = body1.height,
			  h2 = body2.height;
		  
		  return x1 < x2 + w2 &&
			  x1 + w1 > x2 &&
			  y1 < y2 + h2 &&
			  y1 + h1 > y2;
	  }

	  function makeSpace(width, height) {
		  let things = [],
			  timer = makeTimer();

		  const checkCollisions = function() {
			  for (let a of things) {
				  for (let b of things) {
					  if (a == b) continue;
					  if (a.body && b.body && aabb(a.body, b.body)) {
						  a.receiveMessage('COLLISION', { target: b });
						  b.receiveMessage('COLLISION', { target: a });
						  console.log('collision');
					  }
				  }
			  }
		  }

		  function messageAll(message, data) {
			  things.forEach(thing => thing.receiveMessage(message, data));
		  }
		  
		  return Object.freeze({
			  begin() {
				  messageAll('START', {});
				  timer.start();
			  },
			  
			  register(thing) {
				  things.push(thing);
			  },

			  tick() {
				  messageAll('TICK', timer.lap());
				  checkCollisions();
			  },

			  render(screen) {
				  messageAll('RENDER', screen);
			  },

			  width,
			  height,
		  });
	  }

	  function makePaddle(space, width, height) {
		  let body = {
			  x: (space.width / 2) - (width / 2),
			  y: (space.height) - (height * 2),
			  width,
			  height
		  };

		  function render(screen) {
			  screen.rect("white", body);
		  }
		  
		  const o = Object.freeze({
			  render(screen) {
				  screen.rect('white', body);
			  },

			  receiveMessage(message, data) {
				  switch (message) {
				  case 'RENDER': render(data); break;
				  };
			  },

			  moveTo(newX, newY) {
				  body.x = newX - (width / 2);
			  },

			  body,
			  isPaddle: true,
		  });

		  space.register(o);

		  return o;
	  }

	  function makeBall(space, lives) {
		  const body = {
			  x: space.width / 2,
			  y: space.width / 2,
			  width: 12,
			  height: 12
		  };

		  let xvel = 2,
			  yvel = 1;

		  function reflectX() {
		  }

		  function reflectY() {
			  yvel *= -1;
		  }

		  function collision(target) {
			  if (target.isBrick) {
				  
			  } else if (target.isPaddle) {
				  reflectY();
				  body.y = target.body.y - body.height;
			  } else if (target.isWall) {
				  reflectX();
			  } else if (target.isCeiling) {
				  reflectY();
			  }
		  }

		  function tick(deltaTime) {
			  body.x += 20 * deltaTime;
			  body.y += 20 * deltaTime * yvel;
		  }

		  function reset() {
		  }

		  function render(screen) {
			  screen.rect("red", body);
		  }
		  
		  const o = {
			  receiveMessage(message, data) {
				  switch (message) {
				  case 'COLLISION':
					  collision(data.target);
					  break;

				  case 'TICK':
					  tick(data);
					  break;
					  
				  case 'START':
				  case 'OUTOFBOUNDS':
					  reset();
					  break;
					  
				  case 'RENDER':
					  render(data);
					  break;
				  };
			  },
			  body,
			  isBall: true,
		  };

		  space.register(o);

		  return Object.freeze(o);
	  }


	  const screen = makeScreen(document.getElementById('c'));

	  const space = makeSpace(screen.width, screen.height);

	  const paddle = makePaddle(space, 96, 18);

	  const ball = makeBall(space);

	  const score = (function() {
		  let value = 0;
		  
		  function render(screen) {
		  }

		  function receiveMessage(message, data) {
			  switch (message) {
			  case 'RENDER': render(data); break;
			  };
		  }
		  
		  return Object.freeze({
		  });
	  })();

	  document.getElementById('c').addEventListener('mousemove', function(event) {
		  paddle.moveTo(event.clientX, event.clientY);
	  });

	  function render() {
		  screen.clear();
		  space.tick();
		  space.render(screen);
		  requestAnimationFrame(render);
	  }

	  space.begin();
	  render();	  
	</script>
  </body>
</html>
